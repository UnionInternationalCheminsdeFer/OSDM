name: Validate OpenAPI Documents

on:
  push:
    branches:
      - dev-osdm-v4
  pull_request:
    branches:
      - dev-osdm-v4
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest

      - name: Install redocly cli
        run: npm i -g @redocly/cli@latest

      - name: Bundle modular spec
        run: redocly bundle specification/OSDM-online-api.yml --output specification/OSDM-online-api.bundled.yml

      - name: Validate OpenAPI documents
        run: redocly lint --format=github-actions specification/*.yml

      # The bundle was being built and thrown away. Publish it so the combined
      # file is downloadable from every push and pull request, the way
      # create-openapi.yml does it on master.
      - name: Upload bundled specification
        uses: actions/upload-artifact@v4
        with:
          name: osdm-online-api-bundled
          path: specification/OSDM-online-api.bundled.yml
          if-no-files-found: error
