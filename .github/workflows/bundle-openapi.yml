name: Bundle OpenAPI Specification

# Builds the single-file bundle from the modular hub and proposes it to the
# site:
#
#   gh-pages:specification/v4.0/OSDM-online-api-v4.0.0-bundled.yml
#
# osdm.io serves every version from gh-pages. Released versions are published
# there once; v4 is a moving draft, so it is refreshed on each change and the
# site shows the edge spec. What gets published has to be the bundle: the hub
# on its own is an entrypoint of relative $refs that a viewer would have to
# fetch one request at a time.
#
# gh-pages is a protected branch and requires a reviewed pull request, so this
# does not push to it. It keeps a bot branch holding just the refreshed bundle
# and opens a pull request from it; merging that is what updates the site and
# triggers the Pages deploy.
#
# The bundle is generated output and is not committed to this branch. The
# modular tree under specification/ is the source of truth.
on:
  push:
    branches:
      - dev-osdm-v4
    paths:
      - 'specification/**'
      - '.github/workflows/bundle-openapi.yml'
  workflow_dispatch:

# Two runs updating the bot branch at once would race; queue them instead.
concurrency:
  group: bundle-openapi
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest

      - name: Install Redocly CLI
        run: npm i -g @redocly/cli@latest

      - name: Bundle modular spec
        run: redocly bundle specification/OSDM-online-api.yml --output specification/OSDM-online-api.bundled.yml

      - name: Propose the edge bundle to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BRANCH: auto/v4-edge-bundle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          src="$PWD/specification/OSDM-online-api.bundled.yml"
          dest="specification/v4.0/OSDM-online-api-v4.0.0-bundled.yml"

          # Always start from the current gh-pages, so the branch holds exactly
          # one commit: the refreshed bundle.
          git fetch --no-tags --depth=1 origin gh-pages
          git worktree add -B "$BOT_BRANCH" ../edge-bundle FETCH_HEAD
          cd ../edge-bundle
          mkdir -p "$(dirname "$dest")"
          cp "$src" "$dest"
          git add "$dest"
          if git diff --cached --quiet; then
            echo "gh-pages already has this bundle; nothing to propose"
            exit 0
          fi
          git commit -m "chore: refresh the v4 edge bundle from dev-osdm-v4@${GITHUB_SHA:0:7}"

          # Force: the branch is rebuilt on gh-pages every run and is never a
          # base for anything else. An open pull request picks the new commit up.
          git push --force origin "HEAD:$BOT_BRANCH"

          if [ -n "$(gh pr list --head "$BOT_BRANCH" --base gh-pages --state open --json number --jq '.[].number')" ]; then
            echo "existing pull request updated"
            exit 0
          fi
          gh pr create \
            --base gh-pages \
            --head "$BOT_BRANCH" \
            --title "Refresh the v4 edge bundle" \
            --body "Rebuilt from the modular hub at dev-osdm-v4@${GITHUB_SHA:0:7} by the Bundle OpenAPI Specification workflow.

          Updates \`$dest\`, which the osdm.io v4 draft links serve. Merging this republishes the site.

          Generated output only - review the source change on dev-osdm-v4, not this diff."
