get:
  tags:
    - Fulfillments
  summary: get all fulfillments for a booking
  description: |
    get all fulfillments of a booking
  operationId: getFulfillments
  parameters:
    - $ref: ../components/parameters/requestor.yml
    - $ref: ../components/parameters/acceptLanguage.yml
    - $ref: ../components/parameters/traceParent.yml
    - $ref: ../components/parameters/traceState.yml
    - $ref: ../components/parameters/acceptNamespace.yml
    - name: bookingId
      in: query
      schema:
        type: string
    - name: issuingLanguage
      in: query
      description: |
        The desired issuing language (ISO-639-1 language code) for the document(s) produced by this call.
        Relevant for providers that generate the fulfillment lazily when this endpoint is called.
      required: false
      schema:
        type: string
    - name: preferredFulfillmentMedia
      in: query
      description: |
        Preferred media type for the document(s) produced by this call. Relevant for providers that generate
        the fulfillment lazily when this endpoint is called. Applies to this call only and does not persist any
        booking state.
      required: false
      schema:
        $ref: ../components/schemas/FulfillmentMediaType.yml
    - name: requestedFulfillmentType
      in: query
      description: |
        The requested fulfillment type (e.g. paper or e-ticket) for the document(s) produced by this call.
        Relevant for providers that generate the fulfillment lazily when this endpoint is called. Applies to
        this call only and does not persist any booking state.
      required: false
      schema:
        $ref: ../components/schemas/FulfillmentType.yml
  responses:
    '200':
      description: |
        fulfillment found
      content:
        application/vnd.uic.osdm+json:
          schema:
            $ref: ../components/schemas/FulfillmentsResponse.yml
      headers:
        Content-Language:
          schema:
            type: string
            description: >
              The language of translatable strings in the response (see
              RFC2616-sec14.12).
    '400':
      $ref: ../components/responses/BadRequestResponse.yml
    '401':
      $ref: ../components/responses/UnauthorizedResponse.yml
    '403':
      $ref: ../components/responses/ForbiddenResponse.yml
    '404':
      $ref: ../components/responses/NotFoundResponse.yml
    '415':
      $ref: ../components/responses/UnsupportedMediaTypeResponse.yml
    '500':
      $ref: ../components/responses/InternalServerErrorResponse.yml
    '501':
      $ref: ../components/responses/NotImplementedResponse.yml
    '503':
      $ref: ../components/responses/ServiceUnavailableResponse.yml
    default:
      $ref: ../components/responses/DefaultErrorResponse.yml
  security:
    - oAuth2ClientCredentials: []
