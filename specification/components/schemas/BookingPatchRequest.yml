type: object
additionalProperties: false
description: |
  Allows modifying general settings of the booking, e.g. the external
  reference, the selected places or the payment methods used.
properties:
  externalRef:
    type:
      - string
      - 'null'
    description: >-
      The unique booking reference in the distributor/retailer system. Usually
      refers to an order number or PNR.
  placeSelections:
    type: array
    items:
      $ref: ./PlaceSelection.yml
  usedPaymentMethods:
    type: array
    items:
      $ref: ./PaymentMethod.yml
