type: object
additionalProperties: false
discriminator:
  propertyName: objectType
  mapping:
    MultiRideAccount: ./MultiRideAccount.yml
    ReductionCardAccount: ./ReductionCardAccount.yml
    TravelPassAccount: ./TravelPassAccount.yml
required:
  - objectType
  - issuer
  - validFrom
  - validUntil
  - number
properties:
  objectType:
    description: Attribute is used as discriminator for inheritance between data types.
    type: string
  holder:
    $ref: ./PersonDetail.yml
  issuer:
    $ref: ./CompanyRef.yml
  validFrom:
    type: string
    format: date-time
  validUntil:
    type: string
    format: date-time
  number:
    type: string
    agreementId:
      description: | 
        in the case that generic account ids (=number) are used (e.g. accountIds based on the creditt card id or id card) 
        the account might exist in different account based ticketing schemes and an additional identifier is needed to identify the current scheme agreement.
      type: string    
