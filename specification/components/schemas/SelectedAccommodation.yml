type: object
additionalProperties: false
description: |
  Place selection of places for reservation linked to passengers.
required:
  - passengerRefs
  - accommodationType
  - accommodationSubType
properties:
  passengerRefs:
    description: |
      Id of the passenger
    type: array
    items:
      type: string
    minItems: 1
  accommodationType:
    $ref: ./AccommodationType.yml
  accommodationSubType:
    $ref: ./AccommodationSubType.yml
  preferences:
    description: |
      Place preferences requested for the passengers (at most one per preference group), chosen among the `availablePlacePreferences` of the reservation referenced by the `reservationId` of the place selection:
      of the reservation offer part when an offer is booked, or of the booked reservation when the place selection is made or changed after the pre-booking with `PATCH /bookings/{bookingId}`.
      The properties of the allocated places are returned in `ReservedPlace.placeProperties`.
    type:
      - array
      - 'null'
    items:
      $ref: ./PlaceProperty.yml
