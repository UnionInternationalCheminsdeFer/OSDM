type: object
additionalProperties: false
description: |
  A place (e.g. a seat or bicycle hook)
required:
  - number
  - rectangle
  - orientation
properties:
  number:
    description: |
       The place number. There might be cases where the place number is not unique 
       per coach (e.g. same place number for a seat and associated bicycle hook, same place numbers on upper and lower deck)
    type: string
  rectangle:
    $ref: ./RectangleGeometry.yml
  orientation:
    $ref: ./Orientation.yml
  placeProperties:
    description: |
      Static place properties
    type: array
    items:
      $ref: ./PlaceProperty.yml
